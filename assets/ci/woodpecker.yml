# Exemplo de pipeline: build com Kaniko (sem privileged) -> push no registry
# da VPS (https://registry.<dominio>) -> deploy via SSH restrito. Copiar pra raiz do repo de cada app como
# .woodpecker.yml.
#
# Cadastrar como secrets do repo no Woodpecker (repo > Settings > Secrets):
#   registry_user       usuario do registry gerado pelo Setup do cais
#   registry_password   senha desse usuario (o cais mostra no Setup)
#   deploy_ssh_key      chave privada; a publica vai pro authorized_keys do
#                       usuario "deploy" na VPS com o cais como forced command:
#                       command="/usr/local/bin/cais deploy",restrict ssh-ed25519 AAAA...
#
# Nao tem dominio hardcoded aqui: CAIS_REGISTRY e variavel global que o cais
# configura no Woodpecker (WOODPECKER_ENVIRONMENT) com o host do registry.
#
# Nao tem nome de app hardcoded aqui -- usa $CI_REPO_NAME (variavel embutida
# do Woodpecker, nome do repositorio) em tudo. Por isso o nome do repositorio
# Git precisa ser IDENTICO ao nome do app criado no cais (pasta
# /var/lib/cais/apps/<nome> na VPS). Se os nomes divergirem, o cais deploy
# rejeita com "app desconhecido" (falha visivel, nao silenciosa).
#
# O docker-compose.yml deste repo precisa referenciar a imagem como
# "image: REPLACE_REGISTRY/minha-app:REPLACE_TAG", nunca "latest". O step de
# deploy troca REPLACE_REGISTRY pelo host do registry e REPLACE_TAG pelo
# hash do commit antes de
# mandar pro cais deploy -- assim cada deploy fica atrelado a um commit exato,
# nao a uma tag flutuante, e rollback vira so reaplicar um docker-compose.yml
# antigo (o hash do commit anterior ja esta gravado nele).
#
# NAO deixar "${CI_COMMIT_SHA}" (sintaxe de variavel) direto no arquivo: o
# docker compose na VPS tentaria interpolar isso sozinho usando o ambiente
# do host (que nao tem essa variavel), e quebraria silenciosamente.

steps:
  - name: build-and-push
    image: woodpeckerci/plugin-kaniko
    settings:
      registry: ${CAIS_REGISTRY}
      repo: ${CAIS_REGISTRY}/${CI_REPO_NAME}
      tags: latest,${CI_COMMIT_SHA}
      username:
        from_secret: registry_user
      password:
        from_secret: registry_password

  - name: deploy
    image: kroniak/ssh-client
    environment:
      DEPLOY_KEY:
        from_secret: deploy_ssh_key
    commands:
      # a rede docker do host aponta o gateway da bridge pro proprio host,
      # entao da pra alcancar a VPS sem precisar de IP publico nem extra_hosts
      - HOST_IP=$(ip route | awk '/default/ {print $3}')
      - eval $(ssh-agent -s)
      - echo "$DEPLOY_KEY" | tr -d '\r' | ssh-add -
      - mkdir -p ~/.ssh
      - ssh-keyscan -H "$HOST_IP" >> ~/.ssh/known_hosts
      # troca os placeholders pelo registry e pelo hash do commit atual,
      # deixando o arquivo com uma imagem concreta antes de mandar pro cais deploy
      - sed -i -e "s/REPLACE_REGISTRY/${CAIS_REGISTRY}/" -e "s/REPLACE_TAG/${CI_COMMIT_SHA}/" docker-compose.yml
      # o docker-compose.yml deste repo (so estrutura, nenhum secret dentro)
      # viaja pelo stdin do ssh; o cais deploy na VPS manda pro daemon, que
      # valida (recusa padroes perigosos), substitui o existente e so entao
      # roda pull+up. secrets/ na VPS nunca e tocado por aqui.
      - ssh deploy@"$HOST_IP" "$CI_REPO_NAME" < docker-compose.yml
    when:
      - branch: main
